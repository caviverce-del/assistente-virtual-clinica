<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Virtual</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }

    .chat-container {
      width: 420px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .chat-header {
      background: #2b7cff;
      color: white;
      padding: 15px;
      font-size: 20px;
      text-align: center;
      font-weight: bold;
    }

    .chat-box {
      height: 460px;
      padding: 15px;
      overflow-y: auto;
      background: #fafafa;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background: #d1e7ff;
      margin-left: auto;
      text-align: right;
    }

    .bot {
      background: #e8e8e8;
      margin-right: auto;
      text-align: left;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .chat-input button {
      background: #2b7cff;
      color: white;
      border: none;
      padding: 12px 18px;
      cursor: pointer;
    }

    .chat-input button:hover {
      background: #1d63d1;
    }

    .transfer-box {
      margin-bottom: 12px;
    }

    .transfer-link {
      display: inline-block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
    }

    .transfer-link:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">Assistente Virtual</div>

    <div class="chat-box" id="chat-box">
      <div class="message bot">Olá! Como posso te ajudar?</div>
    </div>

    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Digite sua mensagem" onkeydown="if(event.key==='Enter'){sendMessage()}">
      <button onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");
      const message = input.value.trim();

      if (message === "") return;

      const userMessage = document.createElement("div");
      userMessage.classList.add("message", "user");
      userMessage.textContent = message;
      chatBox.appendChild(userMessage);

      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ mensagem: message })
        });

        const data = await response.json();

        const botMessage = document.createElement("div");
        botMessage.classList.add("message", "bot");
        botMessage.textContent = data.resposta;
        chatBox.appendChild(botMessage);

        if (data.transferir === true && data.link_whatsapp) {
          const transferBox = document.createElement("div");
          transferBox.classList.add("transfer-box");

          const transferLink = document.createElement("a");
          transferLink.classList.add("transfer-link");
          transferLink.href = data.link_whatsapp;
          transferLink.target = "_blank";
          transferLink.textContent = "Falar com a recepção no WhatsApp";

          transferBox.appendChild(transferLink);
          chatBox.appendChild(transferBox);
        }

      } catch (error) {
        const botMessage = document.createElement("div");
        botMessage.classList.add("message", "bot");
        botMessage.textContent = "Erro ao conectar com o servidor.";
        chatBox.appendChild(botMessage);
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
